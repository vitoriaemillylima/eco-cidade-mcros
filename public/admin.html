<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Eco Cidade Soluções</title>
    <link rel="icon" href="./assets/images/logo.png">
    
    <!-- Importação do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto:wght@700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
</head>

<body class="bg-slate-100 text-slate-800 font-['Lato'] min-h-screen p-4 sm:p-8">

    <div class="max-w-6xl mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-md border border-slate-200">
        
        <!-- Cabeçalho do Painel Admin -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-200 pb-6 mb-6 gap-4">
            <div>
                <div class="flex items-center gap-3 mb-1">
                    <img src="assets/images/eco-cidade.png" alt="Logo Eco Cidade" class="h-8 w-auto object-contain" />
                    <h1 class="text-2xl font-black font-['Roboto'] text-[#0B3B36]">Relatório de Inscritos</h1>
                </div>
                <p class="text-xs sm:text-sm text-slate-500">Curso: Atualizações do MROSC na Prática (8h) — Eco Cidade Soluções</p>
            </div>
            
            <!-- Botão de Imprimir -->
            <button onclick="window.print()" class="print:hidden bg-[#0B3B36] hover:bg-opacity-90 text-white font-bold font-['Roboto'] px-5 py-2.5 rounded-xl shadow transition flex items-center gap-2 text-sm cursor-pointer">
                <span>🖨️</span> Imprimir Relatório / PDF
            </button>
        </div>

        <!-- Tabela de Alunos Inscritos -->
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm border-collapse">
                <thead>
                    <tr class="bg-[#0B3B36] text-white font-['Roboto']">
                        <th class="p-3 rounded-tl-lg">ID</th>
                        <th class="p-3">Data / Hora</th>
                        <th class="p-3">Nome</th>
                        <th class="p-3">CPF</th>
                        <th class="p-3">Município</th>
                        <th class="p-3">Instituição / Cargo</th>
                        <th class="p-3 rounded-tr-lg">Pagamento</th>
                    </tr>
                </thead>
                <tbody id="tabela-alunos" class="divide-y divide-slate-200">
                    <tr>
                        <td colspan="7" class="p-6 text-center text-slate-500">Carregando inscrições...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Rodapé do Relatório -->
        <div class="mt-8 pt-4 border-t border-slate-200 text-xs text-slate-400 flex justify-between items-center">
            <p>Gerado pelo Sistema Eco Cidade Soluções</p>
            <p id="total-registros">Total de Inscritos: 0</p>
        </div>

    </div>

    <!-- Script de Renderização -->
    <script>
        async function carregarAlunos() {
            const tbody = document.getElementById('tabela-alunos');
            const totalElement = document.getElementById('total-registros');

            try {
                const response = await fetch('/api/alunos');
                if (!response.ok) throw new Error('Erro ao buscar inscritos');
                
                const alunos = await response.json();

                if (!Array.isArray(alunos) || alunos.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="p-6 text-center text-slate-500">Nenhuma inscrição registrada até o momento.</td>
                        </tr>
                    `;
                    totalElement.textContent = 'Total de Inscritos: 0';
                    return;
                }

                tbody.innerHTML = alunos.map(aluno => {
                    const status = (aluno.status_pagamento || 'pendente').toLowerCase();
                    const isAprovado = status === 'aprovado' || status === 'approved';
                    
                    const badgeClass = isAprovado
                        ? 'bg-emerald-100 text-emerald-800 border-emerald-300'
                        : 'bg-amber-100 text-amber-800 border-amber-300';

                    const statusTexto = isAprovado ? 'Aprovado' : 'Pendente';

                    // Suporta tanto data_inscricao quanto criado_em
                    const campoData = aluno.data_inscricao || aluno.criado_em;
                    const dataFormatada = campoData 
                        ? new Date(campoData).toLocaleString('pt-BR') 
                        : '-';

                    return `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-3 font-semibold text-slate-600">#${aluno.id}</td>
                            <td class="p-3 text-slate-500">${dataFormatada}</td>
                            <td class="p-3 font-bold text-slate-800">${aluno.nome || '-'}</td>
                            <td class="p-3 text-slate-600">${aluno.cpf || '-'}</td>
                            <td class="p-3 text-slate-600">${aluno.municipio || '-'}</td>
                            <td class="p-3 text-slate-600">${aluno.instituicao || '-'} ${aluno.cargo ? `/ ${aluno.cargo}` : ''}</td>
                            <td class="p-3">
                                <span class="px-2.5 py-1 text-xs font-bold rounded-full border ${badgeClass}">
                                    ${statusTexto}
                                </span>
                            </td>
                        </tr>
                    `;
                }).join('');

                totalElement.textContent = `Total de Inscritos: ${alunos.length}`;

            } catch (error) {
                console.error(error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="p-6 text-center text-rose-600 font-semibold">
                            Erro ao carregar os dados. Verifique a conexão com a API.
                        </td>
                    </tr>
                `;
            }
        }

        carregarAlunos();
    </script>
</body>
</html>
